services:
  vision:
    build:
      context: .
      dockerfile: Dockerfile.vision
    container_name: ai-vision
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - birdly_net

  audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    container_name: ai-audio
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - birdly_net

  info:
    build:
      context: .
      dockerfile: Dockerfile.info
    container_name: ai-info
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - birdly_net

networks:
  birdly_net:
    name: birdly_net
