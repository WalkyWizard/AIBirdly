services:
  vision:
    build:
      context: vision_service
      dockerfile: Dockerfile
    container_name: ai-vision
    ports:
      - "8001:8001"
    restart: unless-stopped
    networks:
      - birdly_net

  audio:
    build:
      context: audio_service
      dockerfile: Dockerfile
    container_name: ai-audio
    ports:
      - "8002:8002"
    restart: unless-stopped
    networks:
      - birdly_net

  info:
    build:
      context: info_service
      dockerfile: Dockerfile
    container_name: ai-info
    ports:
      - "8003:8003"
    restart: unless-stopped
    networks:
      - birdly_net

networks:
  birdly_net:
    name: birdly_net
